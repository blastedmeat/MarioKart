<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kart Race Control</title>
<meta name="theme-color" content="#0b1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="testbanner" id="testbanner" hidden>TEST MODE · nothing here affects the live event</div>
<header class="top">
  <div class="flag"></div>
  <div class="wrap">
    <div class="brand">
      <h1>Kart <span>Race</span> Control</h1>
      <div class="sync" id="sync"><b></b><span>Loading…</span></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="race">Race</button>
      <button data-tab="players">Players</button>
      <button data-tab="standings">Standings</button>
      <button data-tab="finals">Finals</button>
      <button data-tab="setup">Setup</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="tvroot"></div>
<button class="tvfs" id="tvfs">Full screen</button>
<div id="lights" hidden aria-live="assertive"><div><div class="gantry"><i></i><i></i><i></i><i></i></div><b id="lightsTxt"></b></div></div>
<canvas id="confetti" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
